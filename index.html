<!DOCTYPE html>
<html lang="tr" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kur'an-ı Kerim</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#e9e3d5;
    font-family:Arial,sans-serif;
}

.ust{
    height:60px;
    background:#173b2d;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
}

.ust h1{
    margin:0;
    font-size:20px;
}

#sayfaNo{
    color:#173b2d;
    font-size:13px;
    font-weight:900;
    line-height:1;
    position:absolute;
    top:5px;
    right:7px;
    z-index:1101;
    background:#fff;
    padding:6px 9px;
    border-radius:9px;
    box-shadow:0 2px 6px rgba(0,0,0,.12);
}

.kontroller{
    background:#fff;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:10px;
    padding:10px;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
    width:100%;
    max-width:100%;
    overflow:visible;
}

.kontroller > button,
.kontroller > .sure-kontrol,
.kontroller > .okuyucu-kontrol,
.kontroller > .ek-kontrol-alani,
.kontroller > .ezber-toggle{
    flex:0 0 auto;
    max-width:100%;
}

.kontroller > .durum{
    flex:1 1 100%;
    width:100%;
    min-width:0;
    order:20;
}

button{
    border:1px solid rgba(23,59,45,.12);
    border-radius:12px;
    padding:11px 17px;
    background:linear-gradient(135deg,#174b37,#24664c);
    color:#fff;
    cursor:pointer;
    font-size:14px;
    font-weight:700;
    letter-spacing:.1px;
    box-shadow:0 3px 9px rgba(23,59,45,.18);
    transition:transform .15s ease,box-shadow .15s ease,background .15s ease;
}

button:hover{
    background:linear-gradient(135deg,#24664c,#2f795b);
    transform:translateY(-1px);
    box-shadow:0 5px 13px rgba(23,59,45,.24);
}

button:active{
    transform:translateY(0);
    box-shadow:0 2px 6px rgba(23,59,45,.18);
}

#oynat{
    background:linear-gradient(135deg,#197447,#2b9a61);
}

#oynat:hover{
    background:linear-gradient(135deg,#208652,#36aa6d);
}

#duraklat{
    background:linear-gradient(135deg,#8a6a22,#b28a32);
}

#duraklat:hover{
    background:linear-gradient(135deg,#a27b28,#c29a42);
}

#durdur{
    background:linear-gradient(135deg,#8b3939,#b94d4d);
}

#durdur:hover{
    background:linear-gradient(135deg,#a34141,#c65a5a);
}

#onceki,#sonraki{
    background:linear-gradient(135deg,#315c75,#447b99);
}

#onceki:hover,#sonraki:hover{
    background:linear-gradient(135deg,#3b6e8b,#5289a7);
}

/* Sure seçim alanı */
.sure-kontrol{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 10px 6px 8px;
    background:linear-gradient(135deg,#fff8e8 0%,#f5ead0 100%);
    border:2px solid #b98c31;
    border-radius:18px;
    box-shadow:0 5px 14px rgba(185,140,49,.16);
    position:relative;
    flex-shrink:0;
}
.sure-etiket{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:38px;
    padding:0 13px;
    border-radius:12px;
    color:#fff;
    background:linear-gradient(135deg,#b98c31,#8f651d);
    border:1px solid #7b5514;
    font-size:14px;
    font-weight:900;
    white-space:nowrap;
    box-shadow:0 2px 5px rgba(0,0,0,.12);
}
#sureSec{
    appearance:none;
    -webkit-appearance:none;
    border:0;
    background:transparent;
    color:#5d4619;
    min-height:42px;
    min-width:190px;
    padding:8px 34px 8px 6px;
    font-size:14px;
    font-weight:900;
    cursor:pointer;
    outline:none;
}
.sure-kontrol:after{
    content:"▾";
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    color:#8f651d;
    pointer-events:none;
    font-size:15px;
}
.sure-kontrol:focus-within{
    border-color:#8f651d;
    box-shadow:0 0 0 3px rgba(185,140,49,.18),0 6px 18px rgba(185,140,49,.16);
}
body.gece-modu .sure-kontrol{
    background:linear-gradient(135deg,#3a3324,#2c281f);
    border-color:#8f7335;
}
body.gece-modu #sureSec{color:#f1e8cf}

.okuyucu-kontrol{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:#173b2d;
    font-weight:700;
    padding:4px 5px 4px 10px;
    background:#eef5f0;
    border:1px solid #cbdcd1;
    border-radius:13px;
}

#okuyucuSec{
    appearance:none;
    -webkit-appearance:none;
    border:1px solid #7fa28f;
    border-radius:10px;
    padding:10px 38px 10px 13px;
    background:#fff;
    color:#173b2d;
    font-size:14px;
    font-weight:600;
    min-width:220px;
    max-width:min(420px,70vw);
    cursor:pointer;
    outline:none;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.05);
}

#okuyucuSec:hover{
    border-color:#39785a;
    background:#f8fbf9;
}

#okuyucuSec:focus{
    border-color:#24664c;
    box-shadow:0 0 0 3px rgba(36,102,76,.14);
}

.okuyucu-kontrol{
    position:relative;
}

/* Dil ve Meal seçim kutuları - daha kalın ve canlı tasarım */
.meal-kontrol{
    display:flex;
    align-items:center;
    background:linear-gradient(135deg,#ffffff 0%,#eef7f1 100%);
    border:2px solid #2f7657;
    border-radius:18px;
    padding:6px 12px 6px 7px;
    gap:10px;
    box-shadow:0 5px 14px rgba(36,102,76,.16), inset 0 1px 0 rgba(255,255,255,.95);
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}
.meal-kontrol:hover{
    transform:translateY(-2px);
    border-color:#1f6044;
    box-shadow:0 8px 20px rgba(36,102,76,.22), inset 0 1px 0 rgba(255,255,255,1);
}
.secim-etiket{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:38px;
    padding:0 13px;
    border-radius:12px;
    font-size:14px;
    font-weight:900;
    letter-spacing:.2px;
    white-space:nowrap;
    box-shadow:0 2px 5px rgba(0,0,0,.10), inset 0 1px 0 rgba(255,255,255,.6);
}
.dil-etiket{
    color:#fff;
    background:linear-gradient(135deg,#3478d1,#245aa8);
    border:1px solid #1e4f94;
}
.meal-etiket{
    color:#fff;
    background:linear-gradient(135deg,#d39a25,#a96d0e);
    border:1px solid #8f5c09;
}
#dilSec,#mealSec{
    border:0;
    background:transparent;
    box-shadow:none;
    padding:8px 32px 8px 6px;
    min-height:42px;
    font-size:14px;
    font-weight:900;
    color:#203b30;
    cursor:pointer;
}
#dilSec:hover,#mealSec:hover{
    background:rgba(255,255,255,.72);
    border-radius:11px;
}
#dilSec:focus,#mealSec:focus{
    outline:none;
    border-radius:11px;
}
.dil-kontrol:focus-within{
    border-color:#3478d1;
    box-shadow:0 0 0 3px rgba(52,120,209,.18), 0 6px 18px rgba(52,120,209,.16);
}
.meal-secim-kontrol:focus-within{
    border-color:#d39a25;
    box-shadow:0 0 0 3px rgba(211,154,37,.20), 0 6px 18px rgba(211,154,37,.16);
}
.dil-kontrol:after{
    color:#245aa8;
}
.meal-secim-kontrol:after{
    color:#a96d0e;
}
.okuyucu-kontrol:after{
    content:"▾";
    position:absolute;
    right:16px;
    top:50%;
    transform:translateY(-50%);
    color:#24664c;
    pointer-events:none;
    font-size:15px;
}

/* Görünüm seçimi: Arapça / Meal / İkili */
.gorunum-kontrol{
    position:relative;
    flex:0 0 auto;
}
.gorunum-btn{
    min-width:108px;
    background:linear-gradient(135deg,#4a5d70,#30485c);
}
.gorunum-btn:hover{
    background:linear-gradient(135deg,#587087,#3b566d);
}
.gorunum-panel{
    display:none;
    position:absolute;
    top:calc(100% + 8px);
    right:0;
    z-index:1200;
    width:210px;
    padding:10px;
    background:#fff;
    border:2px solid #78909c;
    border-radius:14px;
    box-shadow:0 8px 24px rgba(0,0,0,.22);
}
.gorunum-panel.acik{display:flex;flex-direction:column;gap:7px}
.gorunum-panel button{
    width:100%;
    min-height:40px;
    padding:8px 10px;
    border-radius:10px;
    background:#f3f7f5;
    color:#173b2d;
    border:1px solid #c5d6cc;
    box-shadow:none;
    font-size:13px;
    font-weight:800;
    text-align:left;
}
.gorunum-panel button:hover{
    background:#e6f1eb;
    transform:none;
    box-shadow:none;
}
.gorunum-panel button.secili{
    background:linear-gradient(135deg,#2f8f5b,#176b3f);
    color:#fff;
    border-color:#145c37;
}

/* Tek sütun görünümünde seçilen taraf tam genişlik kullanır. */
body.gorunum-arapca .sayfalar,
body.gorunum-meal .sayfalar{
    grid-template-columns:1fr;
    max-width:920px;
}
body.gorunum-arapca #mealSayfa,
body.gorunum-meal #sayfa{
    display:none;
}

.durum{
    min-width:280px;
    text-align:center;
    font-size:13px;
}

.mushaf-alani{
    padding:20px;
    display:flex;
    justify-content:center;
}

.sayfalar{
    width:min(1100px,100%);
    display:flex;
    flex-direction:column;
    gap:24px;
    align-items:stretch;
}
.sayfalar #sayfa{
    order:1;
}
.sayfalar #mealSayfa{
    order:2;
}

.sayfa{
    width:100%;
    min-height:1200px;
    background:#fff;
    box-shadow:0 4px 20px rgba(0,0,0,.2);
    padding:55px 60px 80px;
}

.meal-baslik{
    text-align:center;
    font-family:Arial,sans-serif;
    font-size:24px;
    font-weight:700;
    color:#173b2d;
    margin-bottom:8px;
}

.meal-kaynak{
    text-align:center;
    font-size:14px;
    color:#777;
    margin-bottom:28px;
}

.meal-ayet{
    direction:ltr;
    text-align:left;
    font-family:Arial,sans-serif;
    font-size:19px;
    line-height:1.75;
    padding:14px 16px;
    margin:0 0 10px;
    border-radius:8px;
    cursor:pointer;
    transition:background .08s,box-shadow .08s;
}

.meal-ayet:hover{
    background:#f2f6f3;
}

.meal-ayet.okunuyor{
    background:#ffe16a;
    box-shadow:0 0 0 2px rgba(220,170,30,.35);
}

.meal-ayet-no{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:34px;
    width:34px;
    height:34px;
    border-radius:50%;
    background:linear-gradient(135deg,#2f8f5b,#176b3f);
    border:2px solid #145c37;
    color:#fff;
    font-size:14px;
    font-weight:900;
    margin-right:10px;
    vertical-align:middle;
    box-shadow:0 2px 6px rgba(23,107,63,.28);
    flex-shrink:0;

}

/* Meal ayet numaraları: sadece yeşil */
.meal-ayet.okunuyor .meal-ayet-no{
    transform:scale(1.05);
    box-shadow:0 0 0 3px rgba(220,170,30,.28),0 3px 8px rgba(0,0,0,.2);
}


/* Sayfa içinde sûre geçişleri */
.sure-gecis-baslik{
    text-align:center;
    margin:28px auto 18px;
    padding:10px 18px;
    border-top:1px solid rgba(180,145,60,.45);
    border-bottom:1px solid rgba(180,145,60,.45);
    color:#fff;
    font-family:"Times New Roman",serif;
    font-size:24px;
    font-weight:700;
    background:linear-gradient(135deg,#2f8f5b,#176b3f);
    border-radius:8px;
    box-shadow:0 2px 6px rgba(23,107,63,.22);
}
.sure-gecis-baslik small{
    display:block;
    margin-top:3px;
    font-family:Arial,sans-serif;
    font-size:13px;
    font-weight:400;
    color:rgba(255,255,255,.9);
}
.meal-sure-gecis{
    text-align:center;
    margin:24px 0 12px;
    padding:8px 12px;
    border-top:1px solid rgba(180,145,60,.45);
    border-bottom:1px solid rgba(180,145,60,.45);
    color:#fff;
    font-family:"Times New Roman",serif;
    font-size:21px;
    font-weight:700;
    background:linear-gradient(135deg,#2f8f5b,#176b3f);
    border-radius:8px;
    box-shadow:0 2px 6px rgba(23,107,63,.22);
}

@media(max-width:1100px){
    .sayfalar{
        grid-template-columns:1fr;
    }
}

.baslik{
    text-align:center;
    font-family:"Times New Roman",serif;
    font-size:30px;
    margin-bottom:12px;
}

.sayfaBilgi{
    text-align:center;
    font-family:"Times New Roman",serif;
    font-size:17px;
    color:#444;
    margin-bottom:35px;
}

.satir{
    direction:rtl;
    text-align:center;
    font-family:"UthmanicHafs","Times New Roman",serif;
    font-size:31px;
    line-height:2.2;
    min-height:65px;
}

.ayet{
    display:inline;
    border-radius:6px;
    transition:background .08s,box-shadow .08s;
    cursor:pointer;
}

.ayet.okunuyor{
    background:#ffe16a;
    box-shadow:0 0 0 2px rgba(220,170,30,.35);
}

.kelime{
    display:inline;
}

.ayet-no{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:34px;
    height:34px;
    min-width:34px;
    border:2px solid #2f8f5b;
    border-radius:50%;
    background:linear-gradient(135deg,#eef8f1,#d7eddf);
    color:#176b3f;
    font-size:14px;
    font-weight:900;
    margin:0 6px;
    vertical-align:middle;
    box-shadow:0 2px 6px rgba(23,107,63,.20);

}


/* =========================================================
   YENİ KULLANICI ÖZELLİKLERİ
   ========================================================= */

.ek-kontrol-alani{
    display:flex;
    align-items:center;
    gap:7px;
}

#sayfayaGit, #favorilerBtn, #geceModuBtn{
    padding:10px 13px;
    font-weight:800;
}

#sayfayaGit{
    background:linear-gradient(135deg,#6b4ca5,#8b68c8);
}
#sayfayaGit:hover{background:linear-gradient(135deg,#7b5bb5,#9a78d5)}

#favorilerBtn{
    background:linear-gradient(135deg,#a44d62,#d06b80);
}
#favorilerBtn:hover{background:linear-gradient(135deg,#b85b70,#dc7890)}

#geceModuBtn{
    background:linear-gradient(135deg,#26384d,#405a75);
}
#geceModuBtn:hover{background:linear-gradient(135deg,#314961,#4d6b89)}

.ayet-favori{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:25px;
    height:25px;
    margin:0 4px;
    border:1px solid #c5aa55;
    border-radius:50%;
    background:#fffaf0;
    color:#a67c16;
    font-size:14px;
    cursor:pointer;
    vertical-align:middle;
    transition:.15s ease;
}
.ayet-favori:hover{transform:scale(1.08);background:#fff2c7}
.ayet-favori.aktif{background:#f3c64f;color:#fff;border-color:#d0a32f}

.favoriler-panel{
    display:none;
    position:fixed;
    top:72px;
    right:18px;
    width:min(420px,calc(100vw - 30px));
    max-height:70vh;
    overflow:auto;
    z-index:2000;
    background:#fff;
    border:2px solid #b98c31;
    border-radius:16px;
    box-shadow:0 12px 35px rgba(0,0,0,.25);
    padding:16px;
}
.favoriler-panel.acik{display:block}
.favoriler-panel h3{margin:0 0 12px;color:#173b2d}
.favori-satir{padding:10px;border-radius:10px;margin-bottom:8px;background:#f8f4e8;cursor:pointer}
.favori-satir:hover{background:#eee5ce}
.favori-satir strong{color:#806d3b;margin-right:7px}

.sayfa-git-panel{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:3000;
    align-items:center;
    justify-content:center;
}
.sayfa-git-panel.acik{display:flex}
.sayfa-git-kutu{
    width:min(360px,calc(100vw - 30px));
    background:#fff;
    border-radius:18px;
    padding:22px;
    box-shadow:0 15px 40px rgba(0,0,0,.3);
    text-align:center;
}
.sayfa-git-kutu h3{margin:0 0 15px;color:#173b2d}
#sayfaInput{width:100%;padding:12px;border:2px solid #7b5bb5;border-radius:10px;font-size:17px;text-align:center;outline:none}
.sayfa-git-butonlar{display:flex;gap:8px;margin-top:12px}
.sayfa-git-butonlar button{flex:1}
#sayfaGitTamam{background:linear-gradient(135deg,#197447,#2b9a61)}
#sayfaGitIptal{background:linear-gradient(135deg,#777,#999)}

.mobil-kontrol-bar{display:none}

body.gece-modu{background:#151a19;color:#e8e5dc}
body.gece-modu .kontroller{background:#202725;color:#eee}
body.gece-modu .okuyucu-kontrol{background:#28322e;border-color:#43534b;color:#e8eee9}
body.gece-modu .meal-kontrol{background:linear-gradient(135deg,#26322d,#202824)}
body.gece-modu #dilSec,body.gece-modu #mealSec,body.gece-modu #okuyucuSec{color:#edf2ee}
body.gece-modu .sayfa{background:#242724;color:#eee;box-shadow:0 4px 25px rgba(0,0,0,.5)}
body.gece-modu .sayfaBilgi{color:#c9c9c1}
body.gece-modu .meal-kaynak{color:#bbb}
body.gece-modu .meal-ayet:hover{background:#303530}
body.gece-modu .favoriler-panel,body.gece-modu .sayfa-git-kutu{background:#242a27;color:#eee}
body.gece-modu .favoriler-panel h3,body.gece-modu .sayfa-git-kutu h3{color:#dce9df}
body.gece-modu .favori-satir{background:#303630}

@media(max-width:700px){
    .mobil-kontrol-bar{
        position:fixed;
        left:0;right:0;bottom:0;
        z-index:2500;
        display:flex;
        justify-content:center;
        gap:7px;
        padding:9px 8px calc(9px + env(safe-area-inset-bottom));
        background:rgba(23,59,45,.97);
        box-shadow:0 -4px 16px rgba(0,0,0,.22);
    }
    .mobil-kontrol-bar button{padding:10px 13px;font-size:13px}
    .mobil-kontrol-bar .mobil-oynat{background:linear-gradient(135deg,#197447,#2b9a61)}
    .mobil-kontrol-bar .mobil-onceki,.mobil-kontrol-bar .mobil-sonraki{background:linear-gradient(135deg,#315c75,#447b99)}
    body{padding-bottom:64px}
    .ek-kontrol-alani{width:100%;justify-content:center;flex-wrap:wrap}
    #sayfayaGit,#favorilerBtn,#geceModuBtn{flex:1;min-width:105px}
    .favoriler-panel{top:65px;right:10px}
}

@font-face{
    font-family:"UthmanicHafs";
    src:url("https://verses.quran.foundation/fonts/quran/hafs/uthmanic_hafs/UthmanicHafs1Ver18.woff2")
    format("woff2");
}

@media(max-width:700px){

    .ust{
        height:52px;
        padding:0 12px;
    }

    .ust h1{
        font-size:16px;
    }

    .kontroller{
        flex-wrap:wrap;
    }

    .okuyucu-kontrol:not(.kompakt-secim):not(.meal-kontrol){
        width:100%;
        justify-content:center;
    }

    #okuyucuSec{
        min-width:0;
        width:min(100%,420px);
        max-width:100%;
    }

    .mushaf-alani{
        padding:7px;
    }

    .sayfa{
        padding:40px 18px 70px;
    }

    .satir{
        font-size:23px;
        line-height:2.25;
    }

    .meal-ayet{
        font-size:17px;
        line-height:1.7;
    }
}

/* =========================================================
   KOMPAKT SEÇİM BUTONLARI
   Kapalıyken sadece buton adı görünür.
   Tıklanınca native seçim listesi açılır.
   ========================================================= */

.sure-kontrol,
.okuyucu-kontrol.kompakt-secim,
.dil-kontrol,
.meal-secim-kontrol{
    position:relative;
    width:118px;
    min-width:118px;
    height:48px;
    padding:4px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.okuyucu-kontrol.kompakt-secim{
    background:linear-gradient(135deg,#eef5f0,#dfece4);
    border:2px solid #2f7657;
    border-radius:18px;
    box-shadow:0 5px 14px rgba(36,102,76,.16);
}

.sure-kontrol{
    width:118px;
    min-width:118px;
}

        [/Islamic and Cultural League/gi, "İslami ve Kültürel Birlik"],

        ad = ad.replace(regex,metin);

function okumaKonumunuKaydet(sureNo=SURE, ayetNo=aktifAyet){
    if(!Number.isFinite(Number(sureNo)) || !Number.isFinite(Number(ayetNo))) return;
    localStorage.setItem("kuranSonSayfa", String(SAYFA));

}

function favoriMi(ayet){
    return favoriAyetler.some(x => Number(x.sure)===SURE && Number(x.ayet)===Number(ayet));
}

function favoriyiDegistir(ayet){
    const no=Number(ayet);
    if(favoriMi(no)){
        favoriAyetler=favoriAyetler.filter(x => !(Number(x.sure)===SURE && Number(x.ayet)===no));
    }else{
        favoriAyetler.push({sure:SURE,ayet:no,sayfa:SAYFA});
    }
    localStorage.setItem("kuranFavoriAyetler",JSON.stringify(favoriAyetler));
    favorileriGoster();
    mushafFavorileriniGuncelle();
}

function mushafFavorileriniGuncelle(){
    document.querySelectorAll(".ayet-favori").forEach(btn=>{
        const aktif=favoriMi(btn.dataset.ayet);
        btn.textContent=aktif ? "★" : "☆";
        btn.classList.toggle("aktif",aktif);
        btn.title=aktif ? "Favorilerden çıkar" : "Favorilere ekle";
    });
}

function favorileriGoster(){
    if(!favoriAyetler.length){
        favorilerListe.textContent="Henüz favori ayet eklenmedi.";
        return;
    }
    favorilerListe.innerHTML="";
    [...favoriAyetler].sort((a,b)=>a.ayet-b.ayet).forEach(x=>{
        const d=document.createElement("div");
        d.className="favori-satir";
        d.innerHTML=`<strong>En'âm ${x.ayet}. ayet</strong> <span>(Sayfa ${x.sayfa})</span>`;
        d.addEventListener("click",()=>{
            favorilerPanel.classList.remove("acik");
            if(Number(x.sayfa)!==SAYFA){
                SAYFA=Number(x.sayfa);
                sayfaDegisti=true;
                konumuKaydet();
                mushafYukle().then(()=>ayeteGit(x.ayet));
            }else{
                ayeteGit(x.ayet);
            }
        });
        favorilerListe.appendChild(d);
    });
}

function tamSayfayiOlcekle(){
    const sayfalar = document.querySelector(".sayfalar");
    if(!sayfalar) return;

    const sayfa = document.body.classList.contains("gorunum-meal")
        ? document.getElementById("mealSayfa")
        : document.getElementById("sayfa");

    if(!sayfa) return;

    sayfa.classList.remove("tam-sayfa-olcekli");
    sayfalar.style.height = "";

    if(!tamSayfaModu){
        sayfa.style.width = "";
        sayfa.style.maxWidth = "";
        return;
    }

    // Tam sayfa modunda sayfayı kontrollü biçimde genişlet.
    // Aşırı genişletme sağa kayma ve dengesiz boşluk oluşturabiliyor.
    const alanGenislikIlk = Math.max(
        sayfalar.clientWidth || window.innerWidth - 14,
        1
    );

    const yatayGenisletme = Math.min(
        1.18,
        Math.max(1.0, (window.innerHeight / Math.max(window.innerWidth,1)) / 2.35)
    );

    sayfa.style.width = (100 * yatayGenisletme) + "%";
    sayfa.style.maxWidth = "none";
    sayfa.style.marginLeft = "auto";
    sayfa.style.marginRight = "auto";

    // Yeni genişliğe göre içerik yeniden satırlansın.
    void sayfa.offsetHeight;

    // DOM'un doğal yüksekliğini ölç.
    const dogalYukseklik = Math.max(sayfa.scrollHeight, sayfa.offsetHeight, 1);

    // Üst başlık + menü + alt oynatıcı için kullanılabilir alanı hesapla.
    const ust = document.querySelector(".ust");
    const menu = document.getElementById("menuToggle");
    const altBar = document.querySelector(".mobil-kontrol-bar");

    const ustYukseklik = ust ? ust.getBoundingClientRect().height : 0;
    const menuYukseklik = menu ? menu.getBoundingClientRect().height + 6 : 0;
    const altYukseklik = (window.innerWidth <= 700 && altBar)
        ? altBar.getBoundingClientRect().height
        : 0;

    const kullanilabilir = Math.max(
        window.innerHeight - ustYukseklik - menuYukseklik - altYukseklik - 8,
        180
    );

    // Genişlik ve yükseklik sınırlarının ikisini de dikkate al.
    const dogalGenislik = Math.max(sayfa.scrollWidth, sayfa.offsetWidth, 1);
    const alanGenislik = Math.max(
        sayfalar.clientWidth || window.innerWidth - 14,
        1
    );

    const olcekY = kullanilabilir / dogalYukseklik;
    const olcekX = alanGenislik / dogalGenislik;
    const olcek = Math.min(olcekX, olcekY, 1);

    sayfa.style.setProperty("--tam-sayfa-olcek", String(olcek));
    sayfa.classList.add("tam-sayfa-olcekli");

    // Görsel genişlik alanını da ölçeklenmiş yüksekliğe göre ayarla.
    // Transform merkezden uygulandığı için iki yandaki boşluk azalır.
    sayfalar.style.height = Math.ceil(dogalYukseklik * olcek) + "px";

    // Transform akış yüksekliğini değiştirmediği için wrapper'ı
    // ölçeklenmiş yüksekliğe göre ayarla.
}

function sureBilgisiniSayfadanBelirle(verses){
    const ilk = (verses || [])[0];

    // En güvenilir kaynak verse_key'dir: "1:1", "2:1" gibi.
    const key = String(ilk?.verse_key || "");
    const keyChapter = Number(key.split(":")[0]);

    // verse_key geçerliyse onu kullan.
    if(Number.isFinite(keyChapter) && keyChapter >= 1 && keyChapter <= 114){
        const bilgi = SURELER.find(x => x[0] === keyChapter);
        if(bilgi){
            SURE = keyChapter;
            if(sureSec) sureSec.value = String(keyChapter);
            return bilgi;
        }
    }

    // API chapter_id yedek kaynak olarak kullanılır.
    const chapterId = Number(ilk?.chapter_id);
    if(Number.isFinite(chapterId)){
        const bilgi = SURELER.find(x => x[0] === chapterId);
        if(bilgi){
            SURE = chapterId;
            if(sureSec) sureSec.value = String(chapterId);
            return bilgi;
        }
    }

    return SURELER.find(x => x[0] === SURE) || SURELER[0];
}

function sayfaAraliginiAyarla(verses){
    SAYFA_AYETLERI = (verses || [])
        .map(v => ({
            sure: Number(v.chapter_id || String(v.verse_key || "").split(":")[0]),
            ayet: Number(v.verse_number)
        }))
        .filter(x => Number.isFinite(x.sure) && x.sure >= 1 && x.sure <= 114 && Number.isFinite(x.ayet));

    if(!SAYFA_AYETLERI.length)
        throw new Error("Bu sayfada ayet bulunamadı: " + SAYFA);

    /*
     * ÖNEMLİ: Bir mushaf sayfasında birden fazla sûre olabilir.
     * Örneğin bir sayfa Yusuf 118 ile başlayıp Ra'd 1-4 ile devam edebilir.
     * Bu durumda tüm sayfanın ilk ve son ayet numarasını birbirine bağlamak
     * (118–4 gibi) yanlış olur ve bütün ayetleri filtreleyip ekrandan siler.
     * ILK_AYET / SON_AYET yalnızca o anda seçili SURE için tutulur.
     */
    let aktifSureAyetleri = SAYFA_AYETLERI.filter(x => x.sure === Number(SURE));

    if(!aktifSureAyetleri.length){
        const ilkSure = SAYFA_AYETLERI[0].sure;
        SURE = ilkSure;
        if(sureSec) sureSec.value = String(SURE);
        aktifSureAyetleri = SAYFA_AYETLERI.filter(x => x.sure === SURE);
    }

    ILK_AYET = Math.min(...aktifSureAyetleri.map(x => x.ayet));
    SON_AYET = Math.max(...aktifSureAyetleri.map(x => x.ayet));

    sayfaNo.textContent = String(SAYFA);
}

async function okuyuculariYukle(){

    const kayitAnahtari =
    "kuranOkuyucuListesi_" + String(SURE);

    try{

        okuyucuSec.innerHTML =
        '<option value="">Okuyucular yükleniyor...</option>';

        /*
         * BURADA ÖNCEKİ KODDAKİ HATA:
         * API'nin ?sura=... cevabında bazı durumlarda moshaf.surah_list
         * gelmediği için bütün okuyucular eleniyordu. Sonra catch bloğu
         * eski kaydı kullanıyor ve ekranda sadece AbdulBaset kalıyordu.
         *
         * ?sura=SURE zaten sûre filtresini API tarafında yapıyor.
         * Bu yüzden dönen moshafları ayrıca surah_list ile eleme.
         */
        const reciterUrl =
        "https://mp3quran.net/api/v3/reciters" +
        `?sura=${SURE}`;

        const timingReadsUrl =
        "https://mp3quran.net/api/v3/ayat_timing/reads";

        const [reciterCevap, timingCevap] =
        await Promise.all([
            fetch(reciterUrl,{cache:"no-store"}),
            fetch(timingReadsUrl,{cache:"no-store"})
        ]);

        if(!reciterCevap.ok)
            throw new Error("Okuyucu API " + reciterCevap.status);

        const reciterData = await reciterCevap.json();

        let zamanliIdler = new Set();

        if(timingCevap.ok){
            try{
                const timingData = await timingCevap.json();
                const timingArray =
                    Array.isArray(timingData)
                    ? timingData
                    : Array.isArray(timingData.reads)
                        ? timingData.reads
                        : Array.isArray(timingData.data)
                            ? timingData.data
                            : [];

                zamanliIdler = new Set(
                    timingArray
                    .map(x=>Number(x.id ?? x.read_id ?? x.readId ?? x.moshaf_id))
                    .filter(Number.isFinite)
                );
            }catch(e){
                console.warn("Timing okuyucu listesi okunamadı:",e);
            }
        }

        const liste=[];

        for(const reciter of (reciterData.reciters || [])){

            for(const moshaf of (reciter.moshaf || [])){

                const readId = Number(moshaf.id);
                if(!Number.isFinite(readId) || !moshaf.server) continue;

                liste.push({
                    readId,
                    name:
                        reciter.name +
                        " — " +
                        (moshaf.name || "Murattal"),
                    server: moshaf.server,
                    zamanlama: zamanliIdler.has(readId)
                });
            }
        }

        /*
         * Öncelik zamanlaması bulunan okuyucularda.
         * Timing listesi okunamadıysa okuyucuları yine kaybetme;
         * böylece dropdown tek okuyucuya düşmez.
         */
        const zamanliListe =
            zamanliIdler.size
            ? liste.filter(x=>x.zamanlama)
            : liste;

        const kullanilacakListe =
            zamanliListe.length
            ? zamanliListe
            : liste;

        const benzersiz=[];
        const gorulen=new Set();

        for(const x of kullanilacakListe){
            if(gorulen.has(x.readId)) continue;
            gorulen.add(x.readId);
            benzersiz.push(x);
        }

        benzersiz.sort((a,b)=>{
            if(a.readId===DEFAULT_READ_ID) return -1;
            if(b.readId===DEFAULT_READ_ID) return 1;
            return a.name.localeCompare(b.name,"tr");
        });

        if(!benzersiz.length)
            throw new Error("API seçili sûre için okuyucu döndürmedi.");

        OKUYUCULAR=benzersiz;
        localStorage.setItem(
            kayitAnahtari,
            JSON.stringify(OKUYUCULAR)
        );

    }catch(e){

        console.error("Okuyucular yüklenemedi:",e);

        let kayitliListe=null;
        try{
            kayitliListe=JSON.parse(
                localStorage.getItem(kayitAnahtari) || "null"
            );
        }catch(err){}

        if(Array.isArray(kayitliListe) && kayitliListe.length){
            OKUYUCULAR=kayitliListe;
        }

        if(!OKUYUCULAR.length){
            OKUYUCULAR=[{
                readId:DEFAULT_READ_ID,
                name:"AbdulBaset AbdulSamad",
                server:"https://server7.mp3quran.net/basit/",
                zamanlama:true
            }];
        }
    }

    okuyucuSec.innerHTML="";

    for(const x of OKUYUCULAR){
        const option=document.createElement("option");
        option.value=String(x.readId);
        option.textContent=x.name;
        okuyucuSec.appendChild(option);
    }

    const kayitliReadId =
        Number(localStorage.getItem("kuranOkuyucuReadId"));

    const varsayilan =
        OKUYUCULAR.find(x=>x.readId===kayitliReadId) ||
        OKUYUCULAR.find(x=>x.readId===DEFAULT_READ_ID) ||
        OKUYUCULAR[0];

    OKUYUCU=varsayilan;
    okuyucuSec.value=String(OKUYUCU.readId);
}

/* =========================================================
   DURAKLAT
   ========================================================= */

duraklat.addEventListener(
    "click",
    ()=>{

        if(!audio)
            return;


        audio.pause();


        oynuyor=false;


        if(timer)
            cancelAnimationFrame(
                timer
            );


        durum.textContent =
        "Duraklatıldı";

    }
);


/* =========================================================
   DURDUR
   ========================================================= */

durdur.addEventListener(
    "click",
    ()=>{

        if(audio){

            audio.pause();


            const ilk =
            zamanlar.find(
                z=>z.ayet===ILK_AYET
            );


            audio.currentTime =
            ilk
            ? ilk.baslangic
            : 0;

        }


        oynuyor=false;


        if(timer)
            cancelAnimationFrame(
                timer
            );


        temizle();


        durum.textContent =
        "Hazır";

    }
);


/* =========================================================
   OKUYUCU DEĞİŞTİRME
   ========================================================= */

okuyucuSec.addEventListener(
    "change",
    async ()=>{

        const readId =
        Number(okuyucuSec.value);

        const secilen =
        OKUYUCULAR.find(
            x=>x.readId===readId
        );

        if(!secilen)
            return;

        if(audio)
            audio.pause();

        oynuyor=false;

        if(timer)
            cancelAnimationFrame(timer);

        temizle();

        audio=null;
        zamanlar=[];
        tumZamanlar=[];
        aktifAyet=null;
        sayfaDegisti=true;

        OKUYUCU=secilen;
        localStorage.setItem("kuranOkuyucuReadId", String(OKUYUCU.readId));

        durum.textContent =
        OKUYUCU.name +
        " seçildi. Oynat'a basınca zamanlaması yüklenecek.";

    }
);


sureSec.addEventListener("change", async ()=>{
    const yeniSure=Number(sureSec.value);
    const bilgi=SURELER.find(x=>x[0]===yeniSure);
    if(!bilgi) return;

    if(audio) audio.pause();
    oynuyor=false;
    if(timer) cancelAnimationFrame(timer);
    temizle();
    audio=null;
    zamanlar=[];
    tumZamanlar=[];
    aktifAyet=null;
    sayfaDegisti=true;

    SURE=yeniSure;
    // Sûre seçiminden gelen ilk sayfa yüklemesinde seçilen sûreyi koru.
    // Böylece ortak başlangıç sayfalarında (ör. Müddessir/Müzzemmil)
    // sayfanın ilk sûresi seçimi ezmez.
    secilenSureyiKoru=true;
    // Sûre seçildiğinde sûre başlangıç sayfasına git.
    SAYFA=bilgi[2];
    konumuKaydet();
    durum.textContent=`${bilgi[1]} Sûresi yükleniyor...`;

    // Önce mushafı yükle; böylece ortak başlangıç sayfalarında
    // SURE kesinleşsin. Ardından okuyucu listesini doğru sûre için tazele.
    await mushafYukle();
    await okuyuculariYukle();
});

/* Ezber modu aç/kapat */
ezberToggle.addEventListener("click", ()=>{
    const acik = ezberIcerik.classList.toggle("acik");
    ezberToggle.classList.toggle("acik", acik);
});

/* Ezber modu olayları */
ezberSure.addEventListener("change", async ()=>{
    await ezberAyetSinirlariniGuncelle();
});

ezberIlk.addEventListener("change", ()=>{
    if(Number(ezberIlk.value) > Number(ezberSon.value))
        ezberSon.value=ezberIlk.value;
});

ezberSon.addEventListener("change", ()=>{
    if(Number(ezberSon.value) < Number(ezberIlk.value))
        ezberIlk.value=ezberSon.value;
});

ezberBaslat.addEventListener("click", ezberiBaslat);
ezberDurdur.addEventListener("click", ezberiDurdur);

ezberSureleriDoldur();

dilSec.addEventListener("change", async ()=>{
    SECILI_DIL=dilSec.value;
    mealSecGuncelle();
    durum.textContent="Meal seçenekleri güncelleniyor...";
    await mushafYukle();
});

mealSec.addEventListener("change", async ()=>{
    const yeniMeal=Number(mealSec.value);
    if(!MEALLER.some(x => x.id===yeniMeal && x.language===SECILI_DIL)) return;
    SECILI_MEAL=yeniMeal;
    durum.textContent="Meal değiştiriliyor...";
    await mushafYukle();
});


/* =========================================================
   KULLANICI KOLAYLIKLARI
   ========================================================= */

sayfayaGit.addEventListener("click",()=>{
    sayfaInput.value=SAYFA;
    sayfaGitPanel.classList.add("acik");
    setTimeout(()=>{sayfaInput.focus();sayfaInput.select()},50);
});

sayfaGitIptal.addEventListener("click",()=>sayfaGitPanel.classList.remove("acik"));
sayfaGitPanel.addEventListener("click",e=>{if(e.target===sayfaGitPanel) sayfaGitPanel.classList.remove("acik")});

sayfaGitTamam.addEventListener("click",async()=>{
    const hedef=Number(sayfaInput.value);
    if(hedef<MIN_SAYFA || hedef>MAX_SAYFA){
        durum.textContent=`Lütfen ${MIN_SAYFA}-${MAX_SAYFA}. sayfa arasında bir değer girin.`;
        return;
    }
    sayfaGitPanel.classList.remove("acik");
    if(audio) audio.pause();
    oynuyor=false;
    if(timer) cancelAnimationFrame(timer);
    temizle();
    SAYFA=hedef;
    sayfaDegisti=true;
    konumuKaydet();
    await mushafYukle();
});

sayfaInput.addEventListener("keydown",e=>{if(e.key==="Enter") sayfaGitTamam.click()});

favorilerBtn.addEventListener("click",()=>{
    favorilerPanel.classList.toggle("acik");
    if(favorilerPanel.classList.contains("acik")) favorileriGoster();
});

geceModuBtn.addEventListener("click",()=>{
    const acik=!document.body.classList.contains("gece-modu");
    localStorage.setItem("kuranGeceModu",acik?"1":"0");
    geceModunuUygula();
});

tamSayfaBtn.addEventListener("click", ()=>{
    tamSayfaModu = !tamSayfaModu;
    tamSayfayiUygula(true);
    if(gorunumPanel) gorunumPanel.classList.remove("acik");
});

window.addEventListener("resize", ()=>{
    if(tamSayfaModu){
        requestAnimationFrame(tamSayfayiOlcekle);
    }
});

gorunumBtn.addEventListener("click", e=>{
    e.stopPropagation();
    gorunumPanel.classList.toggle("acik");
});

gorunumPanel.querySelectorAll("[data-gorunum]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
        gorunumuUygula(btn.dataset.gorunum);
        gorunumPanel.classList.remove("acik");
    });
});

document.addEventListener("click", e=>{
    if(!e.target.closest(".gorunum-kontrol"))
        gorunumPanel.classList.remove("acik");
});

gorunumuUygula(localStorage.getItem("kuranGorunum") || "ikili", false);
tamSayfayiUygula(false);


document.querySelectorAll(".mobil-kontrol-bar [data-action]").forEach(btn=>{
    btn.addEventListener("click",()=>{
        const hedef=btn.dataset.action;
        if(hedef==="oynat") oynat.click();
        if(hedef==="duraklat") duraklat.click();
        if(hedef==="onceki") onceki.click();
        if(hedef==="sonraki") sonraki.click();
    });
});

/* =========================================================
   SAYFA GEÇİŞLERİ
   ========================================================= */

onceki.addEventListener("click", async ()=>{
    if(SAYFA <= MIN_SAYFA) return;

    /* Okuma devam ediyorsa yeni sayfaya otomatik devam et. */
    const devamEt = oynuyor;

    if(audio) audio.pause();
    oynuyor=false;

    if(timer) cancelAnimationFrame(timer);

    temizle();

    SAYFA--;
    sayfaDegisti = true;
    konumuKaydet();
    await mushafYukle();

    if(devamEt){
        const ilk = SAYFA_AYETLERI[0];
        if(ilk) await ayeteGit(ilk.ayet, ilk.sure, true);
    }
});

sonraki.addEventListener("click", async ()=>{
    if(SAYFA >= MAX_SAYFA) return;

    /* Okuma devam ediyorsa yeni sayfaya otomatik devam et. */
    const devamEt = oynuyor;

    if(audio) audio.pause();
    oynuyor=false;

    if(timer) cancelAnimationFrame(timer);

    temizle();

    SAYFA++;
    sayfaDegisti = true;
    konumuKaydet();
    await mushafYukle();

    if(devamEt){
        const ilk = SAYFA_AYETLERI[0];
        if(ilk) await ayeteGit(ilk.ayet, ilk.sure, true);
    }
});

/* =========================================================
   BAŞLAT
   ========================================================= */

varsayilanSayfayiYukle();
sureSeciminiDoldur();
sureSec.value = String(SURE);
geceModunuUygula();
favorileriGoster();

(async()=>{
    /*
     * Uygulama yeniden açıldığında önce kayıtlı sayfa/sûreyi yükle.
     * Reader listesini bundan önce çağırmak SURE=1 iken listeyi çekip
     * sonradan kaldığımız sûreye geçince yanlış/eksik liste bırakabiliyordu.
     */
    await mealleriYukle();
    await mushafYukle();
    await okuyuculariYukle();
})();

</script>
